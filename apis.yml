apis:
- aid: verdaccio:verdaccio-npm-registry-api
  name: Verdaccio npm Registry API
  description: >-
    The Verdaccio npm Registry REST API implements the CommonJS Compliant Package Registry specification,
    providing endpoints to publish, retrieve, search, and delete npm packages. It supports JWT tokens
    and Basic Auth for authentication and mirrors the standard npm registry protocol so any npm, yarn,
    or pnpm client can interact with it without modification.
